; OUI-SPY Detector — M5Stack Cardputer port
; Upstream: https://github.com/colonelpanichacks/ouispy-detector (MIT)
;
;   pio run -e cardputer -t upload        build + flash
;   pio device monitor                    serial console / dashboard feed

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOUISPY_CARDPUTER
    ; Same fleet-wide LR rate as upstream release builds: flash every node of a
    ; mesh with the same setting (see README).
    -DMESH_ESPNOW_LR_RATE=WIFI_PHY_RATE_LORA_250K

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^6.21.0
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0

; Cardputer = StampS3: ESP32-S3FN8, 8 MB flash, NO PSRAM.
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Sky-Spy drone node variant (Remote ID always on, no filters needed).
[env:cardputer_skyspy]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DSKYSPY_NODE
